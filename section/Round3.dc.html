<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round Flags 3, Dashed Orbit</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&amp;family=Source+Sans+3:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',sans-serif;background:#1e3a1a}
a{text-decoration:none;color:inherit}
.dash{transition:border-color .25s ease,transform .4s ease}
.badge{transition:transform .25s ease}
.fl:hover .dash{border-color:#f4b41a;transform:rotate(25deg)}
.fl:hover .badge{transform:scale(1.12)}
</style>
</helmet>
<div style="width:100%;min-width:0;background:#1e3a1a;padding:84px 48px 90px;box-sizing:border-box;text-align:center">
  <div style="font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:20px;color:#f4b41a">Find a safari tour by</div>
  <h2 style="margin:6px 0 0;font-family:'Playfair Display',serif;font-weight:700;font-size:38px;line-height:1.15;color:#ffffff;text-transform:uppercase">Country across East Africa</h2>
  <div style="width:64px;height:4px;background:#f4b41a;margin:16px auto 52px"></div>
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:44px 56px;justify-content:center">
    <sc-for list="{{countries}}" as="c" hint-placeholder-count="4">
      <a class="fl" href="#" style="display:flex;flex-direction:column;align-items:center;gap:18px;color:#ffffff">
        <div style="position:relative;width:184px;height:184px">
          <div class="dash" style="position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;border-radius:50%;border:2px dashed rgba(243,236,216,.5)"></div>
          <div style="position:absolute;left:14px;top:14px;width:156px;height:156px;border-radius:50%;overflow:hidden;background:#ffffff">
            <sc-if value="{{c.ug}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-hidden="true"><rect width="300" height="200" fill="#000000"></rect><rect y="33.3" width="300" height="33.4" fill="#FCDC04"></rect><rect y="66.7" width="300" height="33.3" fill="#D90000"></rect><rect y="100" width="300" height="33.3" fill="#000000"></rect><rect y="133.3" width="300" height="33.4" fill="#FCDC04"></rect><rect y="166.7" width="300" height="33.3" fill="#D90000"></rect><circle cx="150" cy="100" r="38" fill="#ffffff"></circle><g fill="#3d3d3d"><ellipse cx="146" cy="106" rx="15" ry="10"></ellipse><path d="M156 100 C165 92 164 84 160 80 L155 82 C158 87 157 92 151 98Z"></path><circle cx="159" cy="78" r="5"></circle><rect x="142" y="113" width="2.6" height="14"></rect><rect x="150" y="113" width="2.6" height="14"></rect></g></svg></sc-if>
            <sc-if value="{{c.ke}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-hidden="true"><rect width="300" height="200" fill="#ffffff"></rect><rect width="300" height="58" fill="#000000"></rect><rect y="68" width="300" height="64" fill="#BB0000"></rect><rect y="142" width="300" height="58" fill="#006600"></rect><path d="M112 56 L188 144 M188 56 L112 144" stroke="#ffffff" stroke-width="4"></path><ellipse cx="150" cy="100" rx="27" ry="47" fill="#000000"></ellipse><ellipse cx="150" cy="100" rx="23" ry="43" fill="#BB0000"></ellipse><ellipse cx="150" cy="100" rx="10" ry="31" fill="#ffffff"></ellipse><ellipse cx="150" cy="100" rx="4" ry="22" fill="#000000"></ellipse></svg></sc-if>
            <sc-if value="{{c.tz}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-hidden="true"><rect width="300" height="200" fill="#1EB53A"></rect><polygon points="300,200 300,0 0,200" fill="#00A3DD"></polygon><line x1="-15" y1="212" x2="315" y2="-12" stroke="#FCD116" stroke-width="84"></line><line x1="-15" y1="212" x2="315" y2="-12" stroke="#000000" stroke-width="58"></line></svg></sc-if>
            <sc-if value="{{c.rw}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 300 200" preserveAspectRatio="xMaxYMid slice" style="width:100%;height:100%;display:block" aria-hidden="true"><rect width="300" height="200" fill="#00A1DE"></rect><rect y="100" width="300" height="50" fill="#FAD201"></rect><rect y="150" width="300" height="50" fill="#20603D"></rect><circle cx="238" cy="50" r="15" fill="#E5BE01"></circle><circle cx="238" cy="50" r="27" fill="none" stroke="#E5BE01" stroke-width="10" stroke-dasharray="2.6 4.47"></circle></svg></sc-if>
          </div>
          <span class="badge" style="position:absolute;right:4px;bottom:10px;width:42px;height:42px;border-radius:50%;background:#f4b41a;border:3px solid #1e3a1a;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12210f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
        </div>
        <div>
          <div style="font-family:'Playfair Display',serif;font-weight:700;font-size:28px;line-height:1.1">{{c.name}}</div>
          <div style="font-size:14px;font-weight:700;color:#f4b41a;margin-top:4px">XX tours</div>
        </div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":580}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Uganda', 'Kenya', 'Tanzania', 'Rwanda'];
    const codes = ['UG', 'KE', 'TZ', 'RW'];
    return {
      countries: names.map((n, i) => ({ name: n, ug: codes[i] === 'UG', ke: codes[i] === 'KE', tz: codes[i] === 'TZ', rw: codes[i] === 'RW' }))
    };
  }
}
</script>
</body>
</html>
